<div class="modal-content border-0 shadow-lg">
  <div class="modal-header border-0">
    <h5 class="modal-title fw-bold" [ngClass]="textColor">
      <i [class]="icon"></i> {{ title }}
    </h5>
    <button type="button" class="btn-close" (click)="decline()" aria-label="Close"></button>
  </div>

  <div class="modal-body py-4 text-center">
    <p class="fs-5 mb-0">{{ message }}</p>
  </div>

  <div class="modal-footer border-0 justify-content-center">
    <button *ngIf="isConfirm" type="button" class="btn btn-outline-secondary px-4 me-2" (click)="decline()">
      Cancelar
    </button>

    <button type="button" class="btn px-5" [ngClass]="btnClass" (click)="confirm()">
      {{ isConfirm ? 'Confirmar' : 'Entendido' }}
    </button>
  </div>
</div>
