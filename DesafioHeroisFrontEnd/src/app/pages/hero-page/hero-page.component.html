<div
  class="container d-flex justify-content-center align-items-center py-5 px-3"
  style="min-height: 80vh"
>
<ng-container *ngIf="showForm(); else noResult">
  <div class="card shadow-lg border-0 w-100" style="max-width: 850px">
    <div class="card-header bg-dark text-white p-4">
      <h4
        class="mb-0 text-center fw-bold text-uppercase"
        style="letter-spacing: 1px"
      >
        <i class="bi bi-shield-plus me-2 text-primary"></i>
        {{ isEdit ? "Editando Herói" : "Novo Herói" }}
      </h4>
    </div>

    <div class="card-body p-4">
      <div class="mx-md-3">

          <app-hero-form
          #heroFormRef
          [powerList]="powerList"
          [initialData]="hero"
          (onStatusChange)="handleStatusChange($event)"
          ></app-hero-form>

      </div>
    </div>

    <div
      class="card-footer bg-light p-4 d-flex justify-content-between align-items-center border-top-0"
    >
      <button
        type="button"
        class="btn btn-outline-danger px-4 fw-medium"
        (click)="cancel()"
      >
        <i class="bi bi-x-circle me-1"></i> Cancelar
      </button>

      <button
        type="button"
        class="btn btn-primary px-5 fw-bold shadow-sm"
        [disabled]="!isFormValid"
        (click)="saveHero()"
      >
        Salvar Cadastro <i class="bi bi-check-lg ms-1"></i>
      </button>
    </div>
  </div>
  </ng-container>
<ng-template #noResult>
    <div class="card shadow border-0 text-center p-5" style="max-width: 500px;">
      <div class="card-body">
        <i class="bi bi-search fs-1 text-muted mb-3 d-block"></i>
        <h3 class="fw-bold">Herói não encontrado</h3>
        <p class="text-muted">
          Não conseguimos localizar os dados deste herói. Ele pode ter sido removido ou o link está incorreto.
        </p>
        <button type="button" class="btn btn-dark px-4 mt-3" (click)="cancel()">
          <i class="bi bi-arrow-left me-2"></i>Voltar para Listagem
        </button>
      </div>
    </div>
  </ng-template>



</div>
