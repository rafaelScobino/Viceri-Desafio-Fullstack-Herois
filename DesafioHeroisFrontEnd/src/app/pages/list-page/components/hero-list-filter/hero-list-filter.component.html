<div class="card shadow-sm mb-4 border-0">
  <div class="card-body p-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label class="form-label fw-bold text-secondary">Buscar por Nome</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control border-start-0" placeholder="Ex: Batman..."
                 [(ngModel)]="filters.name" (keyup.enter)="applyFilters()">
        </div>
      </div>

      <div class="col-md-4">
        <label class="form-label fw-bold text-secondary">Superpoder</label>
        <select class="form-select" [(ngModel)]="filters.powerId">
          <option [value]="0">Todos os poderes</option>
          <option *ngFor="let p of powers" [value]="p.id">{{ p.nome }}</option>
        </select>
      </div>

      <div class="col-md-3 d-flex gap-2">
        <button type="button" class="btn btn-primary w-100 fw-bold" (click)="applyFilters()">
          <i class="bi bi-funnel-fill me-1"></i> Filtrar
        </button>

        <button type="button" class="btn btn-outline-secondary" (click)="clearFilters()" title="Limpar Filtros">
          <i class="bi bi-eraser"></i>
        </button>
      </div>
    </div>
  </div>
</div>
